<!doctype html>
<html lang="en" suppressHydrationWarning>
  <head>
    <meta charset="UTF-8" />
    <title>UniAI Chat</title>
    <meta name="description" content="UniAI Chat - Standalone AI Agent Runner" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <script>
      // Prevent theme flash - apply stored theme before React hydrates
      (function () {
        try {
          var stored = localStorage.getItem('automaker-storage');
          if (stored) {
            var data = JSON.parse(stored);
            var theme = data.state && data.state.theme;
            if (theme && theme !== 'system' && theme !== 'light') {
              document.documentElement.classList.add(theme);
            } else if (
              theme === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches
            ) {
              document.documentElement.classList.add('dark');
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
